name: npm release

on:
  workflow_dispatch:
    inputs:
      update_latest:
        description: Update latest (promote an already-published version, no build or publish)
        type: boolean
        default: false
      version:
        description: Exact version for promotion or recovery
        type: string
        default: ""
      resume_server:
        description: After reconciling prior publishes, recover only the server from a verified tagged run; never republish the engine
        type: boolean
        default: false
      resume_cohort:
        description: After reconciling prior publishes, recover missing server/Astro packages from verified tarballs; engine must be published
        type: boolean
        default: false
      include_astro:
        description: Include Astro loader and Starlight when promoting latest (off supports historical runtime-only releases)
        type: boolean
        default: false
      verified_run:
        description: Original tagged run ID for recovery (requires version)
        type: string
        default: ""
  push:
    tags: ["npm-v*"]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || (!inputs.update_latest && !inputs.resume_server && !inputs.resume_cohort)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Check release versions
        id: version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const names = ['document', 'language-server', 'astro-loader', 'starlight'];
          const manifests = names.map(name => JSON.parse(readFileSync(`packages/${name}/package.json`)));
          const document = manifests[0];
          for (const manifest of manifests) {
            assert.equal(manifest.version, document.version, 'Release all four packages at the same version.');
          }
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF_NAME, `npm-v${document.version}`, 'Tag must match the package version.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${document.version}\n`);
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: |
            artifacts/npm/lensmap-document-${{ steps.version.outputs.version }}.tgz
            artifacts/npm/lensmap-language-server-${{ steps.version.outputs.version }}.tgz
            artifacts/npm/lensmap-astro-loader-${{ steps.version.outputs.version }}.tgz
            artifacts/npm/lensmap-starlight-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: artifacts/npm
      - name: Publish the verified cohort to latest in dependency order
        run: |
          for package in document language-server astro-loader starlight; do
            npm publish "artifacts/npm/lensmap-$package-$VERSION.tgz" --access public --tag latest --registry https://registry.npmjs.org/
            node scripts/npm-wait.ts "artifacts/npm/lensmap-$package-$VERSION.tgz" --version "$VERSION"
          done

  resume-server:
    if: github.event_name == 'workflow_dispatch' && (inputs.resume_server || inputs.resume_cohort)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      VERIFIED_RUN: ${{ inputs.verified_run }}
      UPDATE_LATEST: ${{ inputs.update_latest }}
      RESUME_SERVER: ${{ inputs.resume_server }}
      RESUME_COHORT: ${{ inputs.resume_cohort }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - name: Require an original tagged run with successful package verification
        run: |
          test "$UPDATE_LATEST" = false
          test "$RESUME_SERVER" != "$RESUME_COHORT"
          [[ "$VERIFIED_RUN" =~ ^[1-9][0-9]*$ ]]
          node --input-type=module -e 'import { requireExactVersion } from "./scripts/npm-cohort.ts"; requireExactVersion(process.env.VERSION);'
          expected=$(gh api "repos/$GITHUB_REPOSITORY/commits/npm-v$VERSION" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" > original-run.json
          jq -e --arg sha "$expected" --arg tag "npm-v$VERSION" \
            '.event == "push" and .path == ".github/workflows/npm-release.yml" and .head_sha == $sha and .head_branch == $tag' original-run.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/jobs" --jq '.jobs[] | select(.name == "verify") | .conclusion')" = success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: artifacts/npm
          run-id: ${{ inputs.verified_run }}
          github-token: ${{ github.token }}
      - name: Confirm accepted engine and recover only missing retained artifacts
        run: |
          # Reconcile previous accepted/in-flight operations before selecting recovery.
          # Missing/expired artifacts are a blocker, never permission to rebuild.
          node scripts/npm-wait.ts "artifacts/npm/lensmap-document-$VERSION.tgz" --version "$VERSION"
          packages=(language-server)
          if [[ "$RESUME_COHORT" = true ]]; then
            packages+=(astro-loader starlight)
          fi
          for package in "${packages[@]}"; do
            test -f "artifacts/npm/lensmap-$package-$VERSION.tgz"
          done
          for package in "${packages[@]}"; do
            node scripts/npm-wait.ts "artifacts/npm/lensmap-$package-$VERSION.tgz" --version "$VERSION" --publish-missing
          done

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.update_latest && !inputs.resume_server && !inputs.resume_cohort
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      INCLUDE_ASTRO: ${{ inputs.include_astro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - run: node --test scripts/npm-promote.test.ts
      - name: Promote the selected existing cohort to latest and verify tags
        run: |
          args=(--version "$VERSION")
          if [[ "$INCLUDE_ASTRO" = true ]]; then
            args+=(--include-astro)
          fi
          node scripts/npm-promote.ts "${args[@]}"
